[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Your Name <YourName@yourdomain.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/"
repository = "https://github.com/TODO"
homepage = "https://github.com/TODO"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
camino = { version = "1.2.2", features = ["serde1"] }
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.18"
ignore = "0.4.25"
minijinja = "2.20.0"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
serde_norway = "0.9.42"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros"] }

# workspace crates
repoctl-core = { path = "crates/core" }
repoctl-engine = { path = "crates/repoctl-engine" }
repoctl-runner = { path = "crates/repoctl-runner" }
repoctl-scaffold = { path = "crates/repoctl-scaffold" }
repoctl = { path = "crates/repoctl" }
