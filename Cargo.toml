[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.5.1"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/repoctl"
repository = "https://github.com/tyrchen/repoctl"
homepage = "https://github.com/tyrchen/repoctl"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
camino = { version = "1.2.2", features = ["serde1"] }
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
cliclack = "0.5.4"
globset = "0.4.18"
ignore = "0.4.26"
memchr = "2.8.1"
minijinja = "2.20.0"
rayon = "1.12.0"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros"] }
toml_edit = "0.25.11"
tree-sitter = "0.26.9"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

# workspace crates
repoctl-core = { path = "crates/core", version = "0.5.1" }
repoctl-engine = { path = "crates/repoctl-engine", version = "0.5.1" }
repoctl-inspect = { path = "crates/repoctl-inspect", version = "0.5.1" }
repoctl-runner = { path = "crates/repoctl-runner", version = "0.5.1" }
repoctl-scaffold = { path = "crates/repoctl-scaffold", version = "0.5.1" }
repoctl = { path = "crates/repoctl", version = "0.5.1" }
