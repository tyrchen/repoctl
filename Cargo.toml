[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/repoctl"
repository = "https://github.com/tyrchen/repoctl"
homepage = "https://github.com/tyrchen/repoctl"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
camino = { version = "1.2.2", features = ["serde1"] }
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
cliclack = "0.5.4"
globset = "0.4.18"
ignore = "0.4.25"
minijinja = "2.20.0"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros"] }
toml_edit = "0.25.11"

# workspace crates
repoctl-core = { path = "crates/core" }
repoctl-engine = { path = "crates/repoctl-engine" }
repoctl-runner = { path = "crates/repoctl-runner" }
repoctl-scaffold = { path = "crates/repoctl-scaffold" }
repoctl = { path = "crates/repoctl" }
